<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海巡署東部分署115年巡防情報業務輔訪線上測驗系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6">

    <!-- 主容器：針對平板與桌面優化寬度與圓角邊距 -->
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-10 my-auto">

        <!-- 第一部分：基本資料填寫頁 -->
        <div id="login-section">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-2 text-center leading-relaxed">海巡署東部分署115年巡防情報業務輔訪線上測驗系統</h1>
            <p class="text-slate-500 text-center mb-8 text-sm sm:text-base">請先填寫基本資料，點擊開始測驗後即開始計時（10分鐘）</p>
            
            <form id="user-form" class="space-y-5 max-w-xl mx-auto">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">單位</label>
                    <input type="text" id="unit" required class="w-full px-4 py-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例如：第一二岸巡隊">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">職稱</label>
                    <input type="text" id="title" required class="w-full px-4 py-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例如：小隊長">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">姓名</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例如：葉小P">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 rounded-xl transition duration-200 mt-6 text-lg shadow-md">
                    進入測驗
                </button>
            </form>
        </div>

        <!-- 載入中狀態 -->
        <div id="loading-section" class="hidden text-center py-16">
            <div class="inline-block animate-spin rounded-full h-14 w-14 border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-slate-600 mt-4 font-medium text-base sm:text-lg">正在透過雲端安全通道載入題庫，請稍候...</p>
        </div>

        <!-- 第二部分：測驗作答頁 -->
        <div id="quiz-section" class="hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-6 gap-3">
                <div>
                    <span id="display-user-info" class="text-sm sm:text-base font-semibold text-slate-700"></span>
                </div>
                <div class="bg-red-50 text-red-600 px-4 py-2 rounded-full font-bold text-sm sm:text-base border border-red-200 flex items-center gap-1.5 shadow-sm">
                    <span>剩餘時間：</span>
                    <span id="timer">10:00</span>
                </div>
            </div>

            <!-- 題目區塊：加大行距與觸控選項空間 -->
            <div id="questions-container" class="space-y-6">
                <!-- 動態載入題目 -->
            </div>

            <div class="mt-10 text-center">
                <button id="submit-btn" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-10 py-4 rounded-xl shadow-lg transition duration-200 text-lg">
                    交卷並送出成績
                </button>
            </div>
        </div>

        <!-- 第三部分：成績結果頁 -->
        <div id="result-section" class="hidden text-center py-10">
            <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-6">測驗已結束</h2>
            <div class="bg-slate-50 p-8 rounded-2xl border border-slate-200 inline-block w-full max-w-lg mb-8 shadow-inner">
                <p class="text-slate-600 mb-3 text-base">受測人員：<span id="res-user" class="font-bold text-slate-800"></span></p>
                <p class="text-slate-600 mb-2 text-base">測驗成績：</p>
                <div class="text-6xl font-extrabold text-blue-600 mb-3"><span id="res-score">0</span> 分</div>
                <p class="text-sm sm:text-base text-slate-500 font-medium" id="res-detail"></p>
            </div>
            <div>
                <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl transition duration-200 text-base shadow">
                    重新測驗
                </button>
            </div>
        </div>

    </div>

    <script>
        // ★ 請填入您的 Google Apps Script 網頁應用程式網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwMMIEtRg6j7xZleKDyxmHHpvflsIYpLXqnI954Yl9COm5RcECUY8uaw_FZoMXqS46NIA/exec";

        let userInfo = {};
        let quizData = [];
        let timerInterval;
        let timeLeft = 600; // 10 分鐘 (600秒)
        let quizStarted = false;
        let quizSubmitted = false;

        const loginSection = document.getElementById('login-section');
        const loadingSection = document.getElementById('loading-section');
        const quizSection = document.getElementById('quiz-section');
        const resultSection = document.getElementById('result-section');
        const userForm = document.getElementById('user-form');
        const questionsContainer = document.getElementById('questions-container');
        const timerDisplay = document.getElementById('timer');
        const submitBtn = document.getElementById('submit-btn');

        userForm.addEventListener('submit', function(e) {
            e.preventDefault();
            userInfo = {
                unit: document.getElementById('unit').value.trim(),
                title: document.getElementById('title').value.trim(),
                name: document.getElementById('name').value.trim()
            };

            loginSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            loadQuestionsFromGAS();
        });

        // 透過 GAS 安全讀取題庫
        function loadQuestionsFromGAS() {
            fetch(GAS_URL)
                .then(response => response.json())
                .then(rawData => {
                    let validQuestions = rawData.filter(row => row['題目'] && row['選項A'] && row['正確答案']);

                    if (validQuestions.length === 0) {
                        alert("題庫載入失敗或無有效題目，請檢查 Google 試算表格式！");
                        location.reload();
                        return;
                    }

                    // 亂數隨機洗牌並取前 20 題
                    validQuestions.sort(() => Math.random() - 0.5);
                    quizData = validQuestions.slice(0, 20);

                    loadingSection.classList.add('hidden');
                    startQuiz();
                })
                .catch(err => {
                    alert("無法讀取題庫，請確認 Apps Script 部署權限或網路連線！");
                    location.reload();
                });
        }

        function startQuiz() {
            quizSection.classList.remove('hidden');
            document.getElementById('display-user-info').innerText = `單位：${userInfo.unit} | 職稱：${userInfo.title} | 姓名：${userInfo.name}`;
            
            quizStarted = true;
            renderQuestions();
            startTimer();

            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('beforeunload', handleBeforeUnload);
        }

        function renderQuestions() {
            let html = '';
            quizData.forEach((q, index) => {
                html += `
                    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="font-bold text-slate-800 mb-4 text-base sm:text-lg leading-relaxed">${index + 1}. ${q['題目']}</p>
                        <div class="space-y-3">
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="A" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">A. ${q['選項A'] || ''}</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="B" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">B. ${q['選項B'] || ''}</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="C" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">C. ${q['選項C'] || ''}</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="D" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">D. ${q['選項D'] || ''}</span>
                            </label>
                        </div>
                    </div>
                `;
            });
            questionsContainer.innerHTML = html;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerDisplay.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("測驗時間已到，系統將自動交卷！");
                    submitQuiz();
                }
            }, 1000);
        }

        function handleVisibilityChange() {
            if (document.hidden && quizStarted && !quizSubmitted) {
                alert("警告：偵測到您離開測驗頁面或切換分頁，測驗將強制結束！");
                submitQuiz();
            }
        }

        function handleBeforeUnload(e) {
            if (quizStarted && !quizSubmitted) {
                e.preventDefault();
                e.returnValue = '';
            }
        }

        submitBtn.addEventListener('click', function() {
            if (confirm("確定要交卷嗎？")) {
                submitQuiz();
            }
        });

        function submitQuiz() {
            if (quizSubmitted) return;
            quizSubmitted = true;
            clearInterval(timerInterval);

            document.removeEventListener('visibilitychange', handleVisibilityChange);
            window.removeEventListener('beforeunload', handleBeforeUnload);

            let correctCount = 0;
            let totalQ = quizData.length;

            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                if (selected) {
                    let userAns = selected.value.trim().toUpperCase();
                    let correctAns = q['正確答案'].trim().toUpperCase();
                    if (correctAns.includes(userAns) || userAns === correctAns.charAt(0)) {
                        correctCount++;
                    }
                }
            });

            let score = Math.round((correctCount / totalQ) * 100);

            quizSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            document.getElementById('res-user').innerText = `${userInfo.unit} / ${userInfo.title} / ${userInfo.name}`;
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-detail').innerText = `共作答 ${totalQ} 題，答對 ${correctCount} 題`;

            sendScoreToSheet(score);
        }

        function sendScoreToSheet(score) {
            const payload = {
                unit: userInfo.unit,
                title: userInfo.title,
                name: userInfo.name,
                score: score,
                timeStr: new Date().toLocaleString()
            };

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => {
                console.error("成績送出失敗", err);
            });
        }
    </script>
</body>
</html>
